<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marcador Pádel Full Screen</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      @keyframes pulse {
        0% {
          transform: scale(1);
          opacity: 1;
        }
        50% {
          transform: scale(1.3);
          opacity: 0.7;
        }
        100% {
          transform: scale(1);
          opacity: 1;
        }
      }
      .serve-pulse {
        animation: pulse 1.5s infinite;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      .score-transition {
        transition: all 0.3s ease;
      }
    </style>
  </head>
  <body class="bg-gray-900">
    <div id="app" class="h-screen w-screen flex flex-col">
      <!-- Header minimalista -->
      <div
        class="bg-black text-white py-2 px-4 flex justify-between items-center border-b border-gray-800"
      >
        <div class="text-emerald-400 font-bold text-lg">PÁDEL PRO</div>
        <div class="text-xs lg:text-sm">
          <span class="font-semibold">Set [[ setActual ]]</span> |
          <span class="opacity-80">Juego [[ juegoActual ]]</span>
        </div>
        <div class="flex items-center">
          <span class="text-xs mr-1">Saque:</span>
          <span
            :class="{'text-blue-400': servicio === 'azul', 'text-red-400': servicio === 'rojo'}"
            class="font-semibold text-sm"
          >
            [[ servicio === 'azul' ? 'AZUL' : 'ROJO' ]]
          </span>
          <span
            v-if="servicio === 'azul'"
            class="ml-1 w-2 h-2 bg-blue-400 rounded-full serve-pulse"
          ></span>
          <span
            v-if="servicio === 'rojo'"
            class="ml-1 w-2 h-2 bg-red-400 rounded-full serve-pulse"
          ></span>
        </div>
      </div>

      <!-- Contenido principal -->
      <div class="flex-1 flex flex-col lg:flex-row">
        <!-- Equipo Azul -->
        <div
          class="flex-1 bg-gray-800 flex flex-col items-center justify-center p-4 transition-all duration-300"
          :class="{'bg-blue-900/30': servicio === 'azul'}"
        >
          <div class="text-center mb-4 lg:mb-8">
            <div
              class="text-blue-400 font-bold text-4xl lg:text-5xl mb-1 lg:mb-2"
            >
              EQUIPO AZUL
            </div>
            <div class="flex justify-center space-x-4">
              <div
                v-for="(set, index) in 3"
                :key="'azul-set-'+index"
                class="w-10 h-10 lg:w-12 lg:h-12 rounded-full flex items-center justify-center font-bold text-lg"
                :class="{'bg-emerald-500 text-white': sets.azul > index, 'bg-gray-700': sets.azul <= index}"
              >
                [[ index+1 ]]
              </div>
            </div>
          </div>

          <div class="text-center">
            <div
              class="text-9xl lg:text-[12rem] font-bold text-blue-400 mb-2 lg:mb-4 score-transition"
            >
              [[ formatoPunto(puntos.azul) ]]
            </div>
            <div class="text-gray-400 font-medium text-2xl lg:text-3xl">
              Juegos: [[ juegos.azul ]]
            </div>
          </div>
        </div>

        <!-- Divider (solo desktop) -->
        <div
          class="hidden lg:flex items-center justify-center bg-gray-900 px-1"
        >
          <div class="h-32 w-1 bg-gray-700 rounded-full"></div>
        </div>

        <!-- Equipo Rojo -->
        <div
          class="flex-1 bg-gray-800 flex flex-col items-center justify-center p-4 transition-all duration-300"
          :class="{'bg-red-900/30': servicio === 'rojo'}"
        >
          <div class="text-center mb-4 lg:mb-8">
            <div
              class="text-red-400 font-bold text-4xl lg:text-5xl mb-1 lg:mb-2"
            >
              EQUIPO ROJO
            </div>
            <div class="flex justify-center space-x-4">
              <div
                v-for="(set, index) in 3"
                :key="'rojo-set-'+index"
                class="w-10 h-10 lg:w-12 lg:h-12 rounded-full flex items-center justify-center font-bold text-lg"
                :class="{'bg-emerald-500 text-white': sets.rojo > index, 'bg-gray-700': sets.rojo <= index}"
              >
                [[ index+1 ]]
              </div>
            </div>
          </div>

          <div class="text-center">
            <div
              class="text-9xl lg:text-[12rem] font-bold text-red-400 mb-2 lg:mb-4 score-transition"
            >
              [[ formatoPunto(puntos.rojo) ]]
            </div>
            <div class="text-gray-400 font-medium text-2xl lg:text-3xl">
              Juegos: [[ juegos.rojo ]]
            </div>
          </div>
        </div>
      </div>

      <!-- Barra de estado -->
      <div
        class="bg-black text-white py-2 px-4 text-center font-semibold text-lg lg:text-xl border-t border-gray-800"
      >
        [[ estadoPartido ]]
      </div>
    </div>

    <script>
      const { createApp } = Vue;

      createApp({
        delimiters: ["[[", "]]"],

        data() {
          return {
            puntos: {
              azul: 0,
              rojo: 0,
            },
            juegos: {
              azul: 0,
              rojo: 0,
            },
            sets: {
              azul: 0,
              rojo: 0,
            },
            setActual: 1,
            juegoActual: 1,
            servicio: "azul",
            estadoPartido: "En juego",
            socket: null,
          };
        },

        methods: {
          formatoPunto(punto) {
            const puntos = ["0", "15", "30", "40"];
            return punto < 4 ? puntos[punto] : "AD";
          },

          conectarWebSocket() {
            this.socket = io();

            this.socket.on("actualizar_marcador", (data) => {
              // Actualizar todos los datos del marcador
              this.puntos.azul = data.puntos.azul;
              this.puntos.rojo = data.puntos.rojo;
              this.juegos.azul = data.juegos.azul;
              this.juegos.rojo = data.juegos.rojo;
              this.sets.azul = data.sets.azul;
              this.sets.rojo = data.sets.rojo;
              this.setActual = data.setActual;
              this.juegoActual = data.juegoActual;
              this.servicio = data.servicio;
              this.estadoPartido = data.estadoPartido;
            });

            this.socket.on("connect", () => {
              console.log("Conectado al servidor WebSocket");
            });
          },

          actualizarDesdeBackend(data) {
            // Método para actualizar manualmente si es necesario
            Object.assign(this.$data, data);
          },
        },

        mounted() {
          this.conectarWebSocket();
          // Inicializar con valores por defecto
          this.resetearPuntos();
        },
      }).mount("#app");
    </script>
  </body>
</html>
